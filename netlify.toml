# Netlify configuration for Listora static preview

[build]
  # No build command needed - we're serving static HTML directly
  command = "echo 'Static site - no build required'"
  publish = "."

[context.production]
  command = "echo 'Production deployment'"

[[redirects]]
  # Redirect root to index.html for single-page app behavior
  from = "/*"
  to = "/listora-home-preview.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=1800"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
